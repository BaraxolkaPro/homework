<!doctype html>
<html lang="ru" class="page">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/index.css" />
        <link
            rel="shortcut icon"
            href="./icons/nike-favicon-48x48.ico"
            type="image/x-icon"
        />
        <script defer src="./js/index.js" type="module"></script>
        <title>Nike Air Mag</title>
    </head>
    <body class="page__body">
        <header class="header">
            <div class="container header__container">
                <a href="#" class="header__logo logo"
                    ><img src="./icons/logo-icon.svg" alt="Логотип Nike"
                /></a>
                <nav
                    class="header__menu menu"
                    id="header__menu"
                    aria-label="Главное меню"
                >
                    <ul class="menu__list">
                        <li class="menu__item">
                            <a href="#air-mag" class="menu__link">Air Mag</a>
                        </li>
                        <li class="menu__item">
                            <a href="#sizes" class="menu__link">Размеры</a>
                        </li>
                        <li class="menu__item">
                            <a href="#characteristic" class="menu__link"
                                >Характеристики</a
                            >
                        </li>
                        <li class="menu__item">
                            <a href="#top-models" class="menu__link"
                                >Другие ТОП модели</a
                            >
                        </li>
                    </ul>
                </nav>
                <div class="header__controls">
                    <a href="#" class="header__order">Сделать заказ</a>
                    <div class="header__actions">
                        <button
                            class="header__actions-button"
                            aria-label="Поиск"
                            title="Поиск"
                        >
                            <svg width="24" height="24">
                                <use
                                    class="header__actions-icon"
                                    href="./icons/sprites.svg#search"
                                ></use>
                            </svg>
                        </button>
                        <button
                            class="header__actions-button"
                            aria-label="Корзина"
                            title="Корзина"
                        >
                            <svg width="24" height="24">
                                <use
                                    class="header__actions-icon"
                                    href="./icons/sprites.svg#cart"
                                ></use>
                            </svg>
                        </button>
                        <button
                            class="header__burger burger"
                            aria-label="Открыть меню"
                            aria-expanded="false"
                            aria-controls="header__menu"
                        >
                            <svg width="24" height="24">
                                <use
                                    class="burger__icon-menu"
                                    href="./icons/sprites.svg#menu-burger"
                                ></use>
                                <use
                                    class="burger__icon-cross"
                                    href="./icons/sprites.svg#menu-cross"
                                ></use>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>
    </body>
</html>
